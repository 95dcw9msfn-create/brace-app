<script>
  // Silenzia SOLO il messaggio informativo di Babel ("stai usando il compilatore
  // nel browser, precompila per la produzione"): non è un errore dell'app, ma
  // nell'anteprima appariva come banner. Ogni altro errore/avviso reale resta visibile.
  (function () {
    function isBabelNotice(args) {
      var first = args[0];
      return typeof first === "string" && first.indexOf("in-browser Babel transformer") !== -1;
    }
    var originalWarn = console.warn;
    console.warn = function () {
      if (isBabelNotice(arguments)) return;
      return originalWarn.apply(console, arguments);
    };
    var originalError = console.error;
    console.error = function () {
      if (isBabelNotice(arguments)) return;
      return originalError.apply(console, arguments);
    };
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

// --- Icone semplici auto-contenute (nessuna libreria esterna necessaria) ---
function Icon({ children, size = 16, className = "", style = {} }) {
  return (
    <span
      className={className}
      style={{ fontSize: size, lineHeight: 1, display: "inline-flex", ...style }}
    >
      {children}
    </span>
  );
}
const Flame = (p) => <Icon {...p}>🔥</Icon>;
const Clock = (p) => <Icon {...p}>🕐</Icon>;
const ChevronLeft = (p) => <Icon {...p}>‹</Icon>;
const ChevronRight = (p) => <Icon {...p}>›</Icon>;
const Plus = (p) => <Icon {...p}>+</Icon>;
const Minus = (p) => <Icon {...p}>−</Icon>;
const Lock = (p) => <Icon {...p}>🔒</Icon>;
const X = (p) => <Icon {...p}>✕</Icon>;
const Check = (p) => <Icon {...p}>✓</Icon>;
const Trash2 = (p) => <Icon {...p}>🗑</Icon>;
const Settings = (p) => <Icon {...p}>⚙</Icon>;
const User = (p) => <Icon {...p}>👤</Icon>;
const Phone = (p) => <Icon {...p}>📞</Icon>;
const ShieldAlert = (p) => <Icon {...p}>⚠️</Icon>;
const PizzaIcon = (p) => <Icon {...p}>🍕</Icon>;
const CircleAlert = (p) => <Icon {...p}>⚠️</Icon>;
const Loader2 = (p) => <Icon {...p}>⟳</Icon>;
const MapPin = (p) => <Icon {...p}>📍</Icon>;
const Store = (p) => <Icon {...p}>🏬</Icon>;
const Bike = (p) => <Icon {...p}>🚲</Icon>;
const Ruler = (p) => <Icon {...p}>📏</Icon>;

// --- Adattatore di salvataggio: sostituisce window.storage (API di Claude.ai)
// con il localStorage del browser. I dati restano solo su questo dispositivo/browser.
const STORAGE_PREFIX = "brace-app:";
function readAllStorage() {
  try { return JSON.parse(localStorage.getItem(STORAGE_PREFIX + "data") || "{}"); }
  catch (e) { return {}; }
}
function writeAllStorage(data) {
  localStorage.setItem(STORAGE_PREFIX + "data", JSON.stringify(data));
}
window.storage = {
  get: function (key) {
    return Promise.resolve().then(function () {
      const data = readAllStorage();
      if (!(key in data)) return null;
      return { key: key, value: data[key], shared: false };
    });
  },
  set: function (key, value) {
    return Promise.resolve().then(function () {
      const data = readAllStorage();
      data[key] = value;
      writeAllStorage(data);
      return { key: key, value: value, shared: false };
    });
  },
  delete: function (key) {
    return Promise.resolve().then(function () {
      const data = readAllStorage();
      const existed = key in data;
      delete data[key];
      writeAllStorage(data);
      return { key: key, deleted: existed, shared: false };
    });
  },
  list: function (prefix) {
    prefix = prefix || "";
    return Promise.resolve().then(function () {
      const data = readAllStorage();
      const keys = Object.keys(data).filter(function (k) { return k.indexOf(prefix) === 0; });
      return { keys: keys, prefix: prefix, shared: false };
    });
  },
};


function pad2(n) { return String(n).padStart(2, "0"); }

// Ogni fascia oraria (es. 19:00 – 20:00) porta con sé i suoi sotto-intervalli
// da 15 minuti (19:00, 19:15, 19:30, 19:45, 20:00) che il cliente sceglie
// DOPO aver selezionato la fascia oraria principale.
function buildHourSlot(hourStart) {
  const hourEnd = (hourStart + 1) % 24;
  const id = String(hourStart);
  const label = `${pad2(hourStart)}:00 – ${pad2(hourEnd)}:00`;
  const subSlots = [0, 15, 30, 45, 60].map((offset) => {
    const totalMin = hourStart * 60 + offset;
    const hh = Math.floor(totalMin / 60) % 24;
    const mm = totalMin % 60;
    const subLabel = `${pad2(hh)}:${pad2(mm)}`;
    return { id: `${id}-${subLabel}`, label: subLabel };
  });
  return { id, label, subSlots };
}

const SLOTS = [19, 20, 21, 22, 23].map(buildHourSlot);

const CAP = 150;
const DEFAULT_PIN = "1234";
const DEFAULT_DELIVERY_FEE = 2.5;
const WEEKDAYS_IT = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
const MONTHS_IT = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];

const DEFAULT_MENU = [
  { id: "m1", name: "Margherita", price: 6.0 },
  { id: "m2", name: "Marinara", price: 5.0 },
  { id: "m3", name: "Diavola", price: 8.0 },
  { id: "m4", name: "Capricciosa", price: 9.0 },
  { id: "m5", name: "Quattro Formaggi", price: 9.5 },
  { id: "m6", name: "Prosciutto e Funghi", price: 8.5 },
  { id: "m7", name: "Napoli (acciughe)", price: 7.5 },
  { id: "m8", name: "Ortolana", price: 8.0 },
];

const DEFAULT_FORMATS = [
  {
    id: "fmt-mezzo", name: "Pizza mezzo metro", maxGusti: 2,
    variants: [
      { id: "mezzo-margherita", label: "Tutta Margherita", price: 12, mode: "fixed", freeCount: 0 },
      { id: "mezzo-meta", label: "Metà Margherita, metà a scelta", price: 15, mode: "half", freeCount: 1 },
      { id: "mezzo-libero", label: "Tutta a scelta del cliente", price: 20, mode: "free", freeCount: 2 },
    ],
  },
  {
    id: "fmt-metro", name: "Pizza al metro", maxGusti: 3,
    variants: [
      { id: "metro-margherita", label: "Tutta Margherita", price: 15, mode: "fixed", freeCount: 0 },
      { id: "metro-meta", label: "Metà Margherita, metà a scelta", price: 22, mode: "half", freeCount: 1 },
      { id: "metro-libero", label: "Tutta a scelta del cliente", price: 30, mode: "free", freeCount: 3 },
    ],
  },
];

function isoDate(d) { return d.toISOString().slice(0, 10); }

function buildUpcomingDays(count = 14) {
  const days = [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  let cursor = new Date(today);
  while (days.length < count) {
    if (cursor.getDay() !== 1) {
      days.push({
        iso: isoDate(cursor),
        weekday: WEEKDAYS_IT[cursor.getDay()],
        day: cursor.getDate(),
        month: MONTHS_IT[cursor.getMonth()],
      });
    }
    cursor = new Date(cursor.getTime() + 86400000);
  }
  return days;
}

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
function euro(n) { return n.toLocaleString("it-IT", { style: "currency", currency: "EUR" }); }

const PizzaGauge = React.memo(function PizzaGauge({ used, size = 84 }) {
  const pct = Math.min(100, (used / CAP) * 100);
  const over = used > CAP;
  const angle = pct * 3.6;
  const bg = over
    ? `conic-gradient(var(--flame) 0deg 360deg)`
    : `conic-gradient(var(--ember) 0deg ${angle}deg, var(--crust) ${angle}deg 360deg)`;
  return (
    <div className="gauge-wrap" style={{ width: size, height: size }}>
      <div className="gauge-ring" style={{ background: bg }}>
        <div className="gauge-inner">
          <span className="gauge-num">{used}</span>
          <span className="gauge-den">/{CAP}</span>
        </div>
      </div>
      {over && <div className="gauge-badge">+{used - CAP}</div>}
    </div>
  );
});

function App() {
  const [ready, setReady] = useState(false);
  const [menu, setMenu] = useState(DEFAULT_MENU);
  const [formats, setFormats] = useState(DEFAULT_FORMATS);
  const [orders, setOrders] = useState([]);
  const [settings, setSettings] = useState({ adminPin: DEFAULT_PIN, deliveryFee: DEFAULT_DELIVERY_FEE });

  const [view, setView] = useState("cliente");
  const [adminSubView, setAdminSubView] = useState("prenotazioni");
  const [adminUnlocked, setAdminUnlocked] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState("");

  const days = useMemo(() => buildUpcomingDays(14), []);
  const [selDate, setSelDate] = useState(days[0].iso);
  const [selSlot, setSelSlot] = useState(null);
  const [selSubSlot, setSelSubSlot] = useState(null);
  const [cart, setCart] = useState({});
  const [formatCart, setFormatCart] = useState({});
  const [orderType, setOrderType] = useState("ritiro");
  const [customerName, setCustomerName] = useState("");
  const [customerPhone, setCustomerPhone] = useState("");
  const [addrStreet, setAddrStreet] = useState("");
  const [addrScala, setAddrScala] = useState("");
  const [addrPiano, setAddrPiano] = useState("");
  const [dayScroll, setDayScroll] = useState(0);
  const [toast, setToast] = useState(null);
  const [saving, setSaving] = useState(false);
  const [newPizzaName, setNewPizzaName] = useState("");
  const [newPizzaPrice, setNewPizzaPrice] = useState("");

  const [curPin, setCurPin] = useState("");
  const [newPin, setNewPin] = useState("");
  const [confirmPin, setConfirmPin] = useState("");
  const [pinSettingsMsg, setPinSettingsMsg] = useState(null);
  const [deliveryFeeInput, setDeliveryFeeInput] = useState(String(DEFAULT_DELIVERY_FEE));

  useEffect(() => {
    (async () => {
      try {
        const m = await window.storage.get("menu", true);
        if (m && m.value) setMenu(JSON.parse(m.value));
      } catch (e) {}
      try {
        const f = await window.storage.get("formats", true);
        if (f && f.value) setFormats(JSON.parse(f.value));
      } catch (e) {}
      try {
        const o = await window.storage.get("orders", true);
        if (o && o.value) setOrders(JSON.parse(o.value));
      } catch (e) {}
      try {
        const s = await window.storage.get("settings", true);
        if (s && s.value) {
          const parsed = JSON.parse(s.value);
          setSettings(parsed);
          setDeliveryFeeInput(String(parsed.deliveryFee));
        }
      } catch (e) {}
      setReady(true);
    })();
  }, []);

  const showToast = useCallback((msg, kind = "ok") => {
    setToast({ msg, kind });
    setTimeout(() => setToast(null), 3400);
  }, []);

  const persistOrders = useCallback(async (next) => {
    setOrders(next);
    try { await window.storage.set("orders", JSON.stringify(next), true); }
    catch (e) { showToast("Errore nel salvataggio, riprova.", "err"); }
  }, [showToast]);
  const persistMenu = useCallback(async (next) => {
    setMenu(next);
    try { await window.storage.set("menu", JSON.stringify(next), true); }
    catch (e) { showToast("Errore nel salvataggio menu.", "err"); }
  }, [showToast]);
  const persistFormats = useCallback(async (next) => {
    setFormats(next);
    try { await window.storage.set("formats", JSON.stringify(next), true); }
    catch (e) { showToast("Errore nel salvataggio formati.", "err"); }
  }, [showToast]);
  const persistSettings = useCallback(async (next) => {
    setSettings(next);
    try { await window.storage.set("settings", JSON.stringify(next), true); }
    catch (e) { showToast("Errore nel salvataggio impostazioni.", "err"); }
  }, [showToast]);

  // Mappa data+slot -> pizze usate, calcolata una sola volta quando cambiano gli ordini
  // invece di rifare un .filter() su tutti gli ordini ad ogni singola chiamata.
  const usageBySlot = useMemo(() => {
    const map = {};
    for (const o of orders) {
      const key = o.dateIso + "|" + o.slotId;
      map[key] = (map[key] || 0) + o.totalPizzas;
    }
    return map;
  }, [orders]);
  const usedForSlot = useCallback(
    (dateIso, slotId) => usageBySlot[dateIso + "|" + slotId] || 0,
    [usageBySlot]
  );
  const slotIsFull = useCallback(
    (dateIso, slotId) => usedForSlot(dateIso, slotId) >= CAP,
    [usedForSlot]
  );

  const roundCount = useMemo(
    () => Object.values(cart).reduce((s, q) => s + q, 0),
    [cart]
  );
  const roundTotal = useMemo(
    () => Object.entries(cart).reduce((s, [id, q]) => {
      const p = menu.find((m) => m.id === id);
      return s + (p ? p.price * q : 0);
    }, 0),
    [cart, menu]
  );
  const formatCount = useMemo(
    () => Object.values(formatCart).reduce((s, v) => s + (v.qty || 0), 0),
    [formatCart]
  );
  const formatTotal = useMemo(
    () => Object.entries(formatCart).reduce((s, [id, v]) => {
      const f = formats.find((x) => x.id === id);
      const variant = f && f.variants.find((vr) => vr.id === v.variantId);
      return s + (variant && v.qty ? variant.price * v.qty : 0);
    }, 0),
    [formatCart, formats]
  );
  const cartCount = roundCount + formatCount;
  const deliveryFee = orderType === "consegna" ? (settings.deliveryFee || 0) : 0;
  const cartTotal = roundTotal + formatTotal + deliveryFee;

  const changeQty = useCallback((id, delta) => {
    setCart((prev) => {
      const next = { ...prev };
      const nv = Math.max(0, (next[id] || 0) + delta);
      if (nv === 0) delete next[id]; else next[id] = nv;
      return next;
    });
  }, []);

  const changeFormatQty = useCallback((id, delta) => {
    const fmt = formats.find((f) => f.id === id);
    setFormatCart((prev) => {
      const next = { ...prev };
      const cur = next[id] || { qty: 0, variantId: fmt.variants[0].id, gusti: [] };
      const nv = Math.max(0, cur.qty + delta);
      if (nv === 0) { delete next[id]; }
      else { next[id] = { ...cur, qty: nv }; }
      return next;
    });
  }, [formats]);

  const selectVariant = useCallback((formatId, variantId) => {
    setFormatCart((prev) => {
      const cur = prev[formatId] || { qty: 1 };
      return { ...prev, [formatId]: { ...cur, variantId, gusti: [] } };
    });
  }, []);

  const toggleGusto = useCallback((formatId, gustoName) => {
    const fmt = formats.find((f) => f.id === formatId);
    setFormatCart((prev) => {
      const cur = prev[formatId];
      if (!cur) return prev;
      const variant = fmt.variants.find((v) => v.id === cur.variantId);
      const has = cur.gusti.includes(gustoName);
      let nextGusti;
      if (has) nextGusti = cur.gusti.filter((g) => g !== gustoName);
      else {
        const limit = variant.mode === "half" ? 1 : variant.freeCount;
        if (cur.gusti.length >= limit) return prev;
        nextGusti = [...cur.gusti, gustoName];
      }
      return { ...prev, [formatId]: { ...cur, gusti: nextGusti } };
    });
  }, [formats]);

  const submitOrder = useCallback(async () => {
    if (!selSlot) return showToast("Scegli una fascia oraria.", "err");
    if (!selSubSlot) return showToast("Scegli l'orario preciso.", "err");
    if (cartCount === 0) return showToast("Aggiungi almeno una pizza.", "err");
    if (!customerName.trim()) return showToast("Inserisci il tuo nome.", "err");
    if (!customerPhone.trim()) return showToast("Inserisci un numero di telefono.", "err");
    if (orderType === "consegna" && !addrStreet.trim()) {
      return showToast("Inserisci l'indirizzo per la consegna.", "err");
    }
    for (const [id, v] of Object.entries(formatCart)) {
      const f = formats.find((x) => x.id === id);
      const variant = f.variants.find((vr) => vr.id === v.variantId);
      if (v.qty > 0 && variant.mode === "half" && v.gusti.length !== 1) {
        return showToast(`Scegli il gusto a piacere per ${f.name} (${variant.label}).`, "err");
      }
      if (v.qty > 0 && variant.mode === "free" && (v.gusti.length < 1 || v.gusti.length > variant.freeCount)) {
        return showToast(`Scegli da 1 a ${variant.freeCount} gusti per ${f.name} (${variant.label}).`, "err");
      }
    }
    if (slotIsFull(selDate, selSlot)) {
      return showToast("Questa fascia oraria è esaurita. Scegline un'altra.", "err");
    }
    setSaving(true);
    const items = [
      ...Object.entries(cart).map(([id, qty]) => {
        const p = menu.find((m) => m.id === id);
        return { name: p.name, price: p.price, qty };
      }),
      ...Object.entries(formatCart).filter(([, v]) => v.qty > 0).map(([id, v]) => {
        const f = formats.find((x) => x.id === id);
        const variant = f.variants.find((vr) => vr.id === v.variantId);
        const composition = variant.mode === "fixed" ? "Margherita"
          : variant.mode === "half" ? `Margherita + ${v.gusti[0]}`
          : v.gusti.join(", ");
        return { name: `${f.name} – ${variant.label} (${composition})`, price: variant.price, qty: v.qty };
      }),
    ];
    const dayInfo = days.find((d) => d.iso === selDate);
    const subSlotInfo = SLOTS.find((s) => s.id === selSlot).subSlots.find((sub) => sub.id === selSubSlot);
    const order = {
      id: uid(),
      dateIso: selDate,
      dateLabel: `${dayInfo.weekday} ${dayInfo.day} ${dayInfo.month}`,
      slotId: selSlot,
      slotLabel: SLOTS.find((s) => s.id === selSlot).label,
      exactTime: subSlotInfo.label,
      items,
      totalPizzas: cartCount,
      totalPrice: cartTotal,
      orderType,
      address: orderType === "consegna" ? { street: addrStreet.trim(), scala: addrScala.trim(), piano: addrPiano.trim() } : null,
      deliveryFee,
      customerName: customerName.trim(),
      phone: customerPhone.trim(),
      createdAt: Date.now(),
    };
    await persistOrders([...orders, order]);
    setSaving(false);
    setCart({}); setFormatCart({}); setCustomerName(""); setCustomerPhone("");
    setAddrStreet(""); setAddrScala(""); setAddrPiano("");
    setSelSubSlot(null);
    showToast(`Prenotazione confermata: ${order.totalPizzas} pizze per le ${order.exactTime}.`, "ok");
  }, [
    selSlot, selSubSlot, cartCount, customerName, customerPhone, orderType, addrStreet, addrScala, addrPiano,
    formatCart, formats, selDate, slotIsFull, cart, menu, days, cartTotal, deliveryFee, orders,
    persistOrders, showToast,
  ]);


  const deleteOrder = useCallback(async (id) => {
    await persistOrders(orders.filter((o) => o.id !== id));
    showToast("Prenotazione eliminata.", "ok");
  }, [orders, persistOrders, showToast]);

  const tryUnlock = useCallback(() => {
    if (pinInput === (settings.adminPin || DEFAULT_PIN)) { setAdminUnlocked(true); setPinError(""); }
    else setPinError("PIN errato. Riprova.");
  }, [pinInput, settings.adminPin]);

  const addMenuItem = useCallback(async () => {
    const price = parseFloat(newPizzaPrice.replace(",", "."));
    if (!newPizzaName.trim() || isNaN(price) || price <= 0) return showToast("Nome e prezzo pizza non validi.", "err");
    await persistMenu([...menu, { id: uid(), name: newPizzaName.trim(), price }]);
    setNewPizzaName(""); setNewPizzaPrice("");
  }, [newPizzaName, newPizzaPrice, menu, persistMenu, showToast]);
  const removeMenuItem = useCallback(
    async (id) => { await persistMenu(menu.filter((m) => m.id !== id)); },
    [menu, persistMenu]
  );
  const updateMenuItemLocal = useCallback((id, field, value) => {
    setMenu((prev) => prev.map((m) => (m.id === id ? { ...m, [field]: value } : m)));
  }, []);
  const commitMenuEdit = useCallback(async () => { await persistMenu(menu); }, [menu, persistMenu]);

  const updateFormatVariantLocal = useCallback((formatId, variantId, price) => {
    setFormats((prev) => prev.map((f) => (
      f.id === formatId
        ? { ...f, variants: f.variants.map((v) => (v.id === variantId ? { ...v, price } : v)) }
        : f
    )));
  }, []);
  const commitFormatEdit = useCallback(async () => { await persistFormats(formats); }, [formats, persistFormats]);

  const savePin = useCallback(async () => {
    setPinSettingsMsg(null);
    if (curPin !== (settings.adminPin || DEFAULT_PIN)) return setPinSettingsMsg({ kind: "err", text: "Il PIN attuale non è corretto." });
    if (!/^\d{4,6}$/.test(newPin)) return setPinSettingsMsg({ kind: "err", text: "Il nuovo PIN deve avere 4-6 cifre." });
    if (newPin !== confirmPin) return setPinSettingsMsg({ kind: "err", text: "I due PIN non coincidono." });
    await persistSettings({ ...settings, adminPin: newPin });
    setCurPin(""); setNewPin(""); setConfirmPin("");
    setPinSettingsMsg({ kind: "ok", text: "PIN aggiornato con successo." });
  }, [curPin, newPin, confirmPin, settings, persistSettings]);

  const saveDeliveryFee = useCallback(async () => {
    const fee = parseFloat(deliveryFeeInput.replace(",", "."));
    if (isNaN(fee) || fee < 0) return showToast("Costo di consegna non valido.", "err");
    await persistSettings({ ...settings, deliveryFee: fee });
    showToast("Costo di consegna aggiornato.", "ok");
  }, [deliveryFeeInput, settings, persistSettings, showToast]);

  const visibleDays = useMemo(
    () => days.slice(dayScroll, dayScroll + 5),
    [days, dayScroll]
  );
  const [adminDate, setAdminDate] = useState(days[0].iso);
  const adminOrdersForDay = useMemo(
    () => orders.filter((o) => o.dateIso === adminDate).sort((a, b) => a.createdAt - b.createdAt),
    [orders, adminDate]
  );

  if (!ready) {
    return (
      <div className="root loading-root">
        <style>{baseCss}</style>
        <Loader2 className="spin" size={28} />
        <span>Accensione del forno…</span>
      </div>
    );
  }

  return (
    <div className="root">
      <style>{baseCss}</style>

      <header className="topbar">
        <div className="brand">
          <Flame size={22} className="brand-flame" />
          <span className="brand-name">BRACE</span>
          <span className="brand-sub">prenotazioni pizzeria</span>
        </div>
        <div className="tabs">
          <button className={"tab" + (view === "cliente" ? " tab-active" : "")} onClick={() => setView("cliente")}>Prenota</button>
          <button className={"tab" + (view === "gestione" ? " tab-active" : "")} onClick={() => setView("gestione")}>
            <Settings size={14} style={{ marginRight: 5, verticalAlign: -2 }} />Gestione
          </button>
        </div>
      </header>

      {view === "cliente" && (
        <main className="page">
          <section className="hero">
            <h1>Prenota le tue pizze<br /><span className="hero-accent">martedì – domenica</span></h1>
            <p className="hero-sub">Servizio dalle 19:00 alle 00:00. Scegli giorno, orario, formato e gusti: pensiamo noi al resto.</p>
          </section>

          <section className="day-picker">
            <button className="day-nav" disabled={dayScroll === 0} onClick={() => setDayScroll((s) => Math.max(0, s - 5))}><ChevronLeft size={18} /></button>
            <div className="day-row">
              {visibleDays.map((d) => (
                <button key={d.iso} className={"day-pill" + (selDate === d.iso ? " day-pill-active" : "")} onClick={() => { setSelDate(d.iso); setSelSlot(null); setSelSubSlot(null); }}>
                  <span className="day-weekday">{d.weekday.slice(0, 3)}</span>
                  <span className="day-num">{d.day}</span>
                  <span className="day-month">{d.month}</span>
                </button>
              ))}
            </div>
            <button className="day-nav" disabled={dayScroll + 5 >= days.length} onClick={() => setDayScroll((s) => Math.min(days.length - 5, s + 5))}><ChevronRight size={18} /></button>
          </section>

          <section className="slots-section">
            <h2 className="section-title"><Clock size={16} /> Fascia oraria</h2>
            <div className="slots-grid">
              {SLOTS.map((s) => {
                const used = usedForSlot(selDate, s.id);
                const full = used >= CAP;
                const active = selSlot === s.id;
                return (
                  <button key={s.id} disabled={full} className={"slot-card" + (active ? " slot-card-active" : "") + (full ? " slot-card-full" : "")} onClick={() => { setSelSlot(s.id); setSelSubSlot(null); }}>
                    <PizzaGauge used={used} />
                    <span className="slot-label">{s.label}</span>
                    <span className="slot-status">{full ? "Esaurito" : `${Math.max(0, CAP - used)} pizze disp.`}</span>
                  </button>
                );
              })}
            </div>
            {selSlot && (
              <div className="subslot-block">
                <span className="subslot-title">Scegli l'orario preciso</span>
                <div className="subslot-row">
                  {SLOTS.find((s) => s.id === selSlot).subSlots.map((sub) => (
                    <button
                      key={sub.id}
                      className={"subslot-chip" + (selSubSlot === sub.id ? " subslot-chip-active" : "")}
                      onClick={() => setSelSubSlot(sub.id)}
                    >
                      {sub.label}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </section>

          <section className="order-type-section">
            <h2 className="section-title"><Store size={16} /> Ritiro o consegna</h2>
            <div className="order-type-toggle">
              <button className={"ot-btn" + (orderType === "ritiro" ? " ot-btn-active" : "")} onClick={() => setOrderType("ritiro")}>
                <Store size={16} /> Ritiro in pizzeria
              </button>
              <button className={"ot-btn" + (orderType === "consegna" ? " ot-btn-active" : "")} onClick={() => setOrderType("consegna")}>
                <Bike size={16} /> Consegna a domicilio
              </button>
            </div>
            {orderType === "consegna" && (
              <div className="delivery-fields">
                <div className="field">
                  <MapPin size={14} />
                  <input placeholder="Indirizzo (via e numero civico)" value={addrStreet} onChange={(e) => setAddrStreet(e.target.value)} />
                </div>
                <div className="field-row">
                  <div className="field">
                    <input placeholder="Scala" value={addrScala} onChange={(e) => setAddrScala(e.target.value)} />
                  </div>
                  <div className="field">
                    <input placeholder="Piano" value={addrPiano} onChange={(e) => setAddrPiano(e.target.value)} />
                  </div>
                </div>
                <span className="delivery-note">Costo di consegna: {euro(settings.deliveryFee || 0)}</span>
              </div>
            )}
          </section>

          <section className="menu-section">
            <h2 className="section-title"><PizzaIcon size={16} /> Le tue pizze</h2>
            <div className="menu-list">
              {menu.map((p) => (
                <div className="menu-row" key={p.id}>
                  <div className="menu-info">
                    <span className="menu-name">{p.name}</span>
                    <span className="menu-price">{euro(p.price)}</span>
                  </div>
                  <div className="qty-control">
                    <button className="qty-btn" onClick={() => changeQty(p.id, -1)}><Minus size={14} /></button>
                    <span className="qty-val">{cart[p.id] || 0}</span>
                    <button className="qty-btn" onClick={() => changeQty(p.id, 1)}><Plus size={14} /></button>
                  </div>
                </div>
              ))}
            </div>
          </section>

          <section className="menu-section">
            <h2 className="section-title"><Ruler size={16} /> Formati grandi (mezzo metro / metro)</h2>
            <div className="menu-list">
              {formats.map((f) => {
                const cur = formatCart[f.id];
                const variant = cur && f.variants.find((v) => v.id === cur.variantId);
                return (
                  <div className="format-card" key={f.id}>
                    <div className="menu-row">
                      <div className="menu-info">
                        <span className="menu-name">{f.name}</span>
                        <span className="menu-price">da {euro(Math.min(...f.variants.map((v) => v.price)))}</span>
                      </div>
                      <div className="qty-control">
                        <button className="qty-btn" onClick={() => changeFormatQty(f.id, -1)}><Minus size={14} /></button>
                        <span className="qty-val">{cur ? cur.qty : 0}</span>
                        <button className="qty-btn" onClick={() => changeFormatQty(f.id, 1)}><Plus size={14} /></button>
                      </div>
                    </div>
                    {cur && cur.qty > 0 && (
                      <div className="variant-block">
                        <div className="variant-picker">
                          {f.variants.map((v) => (
                            <button
                              key={v.id}
                              className={"variant-chip" + (cur.variantId === v.id ? " variant-chip-active" : "")}
                              onClick={() => selectVariant(f.id, v.id)}
                            >
                              {v.label} · {euro(v.price)}
                            </button>
                          ))}
                        </div>
                        {variant && variant.mode === "half" && (
                          <div className="gusti-picker">
                            <span className="gusti-fixed-label">Margherita +</span>
                            {menu.map((p) => (
                              <button
                                key={p.id}
                                className={"gusto-chip" + (cur.gusti.includes(p.name) ? " gusto-chip-active" : "")}
                                onClick={() => toggleGusto(f.id, p.name)}
                              >
                                {p.name}
                              </button>
                            ))}
                          </div>
                        )}
                        {variant && variant.mode === "free" && (
                          <div className="gusti-picker">
                            {menu.map((p) => (
                              <button
                                key={p.id}
                                className={"gusto-chip" + (cur.gusti.includes(p.name) ? " gusto-chip-active" : "")}
                                onClick={() => toggleGusto(f.id, p.name)}
                              >
                                {p.name}
                              </button>
                            ))}
                            <span className="gusti-count">{cur.gusti.length}/{variant.freeCount} selezionati</span>
                          </div>
                        )}
                        {variant && variant.mode === "fixed" && (
                          <div className="gusti-picker"><span className="gusti-fixed-label">Gusto: Margherita</span></div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </section>

          <section className="summary-section">
            <div className="summary-card">
              {selSubSlot && (
                <div className="summary-row"><span>Orario</span><strong>{SLOTS.find((s) => s.id === selSlot).subSlots.find((sub) => sub.id === selSubSlot).label}</strong></div>
              )}
              <div className="summary-row"><span>Pizze</span><strong>{cartCount}</strong></div>
              {deliveryFee > 0 && <div className="summary-row"><span>Consegna</span><strong>{euro(deliveryFee)}</strong></div>}
              <div className="summary-row"><span>Totale</span><strong>{euro(cartTotal)}</strong></div>
              <div className="field"><User size={14} /><input placeholder="Nome e cognome" value={customerName} onChange={(e) => setCustomerName(e.target.value)} /></div>
              <div className="field"><Phone size={14} /><input placeholder="Numero di telefono" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} /></div>
              {selSlot && !selSubSlot && (
                <div className="warn-line"><CircleAlert size={14} /> Scegli l'orario preciso qui sopra.</div>
              )}
              {selSlot && slotIsFull(selDate, selSlot) && (
                <div className="warn-line"><CircleAlert size={14} /> Fascia esaurita, scegline un'altra.</div>
              )}
              <button className="submit-btn" disabled={saving || !selSlot || !selSubSlot} onClick={submitOrder}>
                {saving ? <Loader2 className="spin" size={16} /> : <Check size={16} />}
                Conferma prenotazione
              </button>
            </div>
          </section>
        </main>
      )}

      {view === "gestione" && !adminUnlocked && (
        <main className="page admin-lock">
          <div className="lock-card">
            <Lock size={26} className="lock-icon" />
            <h2>Area gestione</h2>
            <p>Inserisci il PIN per vedere le prenotazioni.</p>
            <input type="password" value={pinInput} onChange={(e) => setPinInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && tryUnlock()} placeholder="PIN" className="pin-input" />
            {pinError && <span className="pin-error"><ShieldAlert size={13} /> {pinError}</span>}
            <button className="submit-btn" onClick={tryUnlock}>Entra</button>
            <span className="pin-hint">Il PIN si cambia dalla sezione Impostazioni, una volta entrato. Non è una vera protezione di sicurezza: è un filtro leggero lato client.</span>
          </div>
        </main>
      )}

      {view === "gestione" && adminUnlocked && (
        <main className="page">
          <section className="admin-header">
            <h1>Gestione</h1>
            <div className="admin-subtabs">
              <button className={"subtab" + (adminSubView === "prenotazioni" ? " subtab-active" : "")} onClick={() => setAdminSubView("prenotazioni")}>Prenotazioni</button>
              <button className={"subtab" + (adminSubView === "menu" ? " subtab-active" : "")} onClick={() => setAdminSubView("menu")}>Menu</button>
              <button className={"subtab" + (adminSubView === "impostazioni" ? " subtab-active" : "")} onClick={() => setAdminSubView("impostazioni")}>Impostazioni</button>
            </div>
          </section>

          {adminSubView === "prenotazioni" && (
            <>
              <div className="date-select-row">
                <select value={adminDate} onChange={(e) => setAdminDate(e.target.value)} className="date-select">
                  {days.map((d) => <option key={d.iso} value={d.iso}>{d.weekday} {d.day} {d.month}</option>)}
                </select>
              </div>
              <section className="slots-grid admin-slots">
                {SLOTS.map((s) => {
                  const used = usedForSlot(adminDate, s.id);
                  return (
                    <div className="slot-card slot-card-static" key={s.id}>
                      <PizzaGauge used={used} />
                      <span className="slot-label">{s.label}</span>
                      <span className="slot-status">{used >= CAP ? "Esaurito" : `${Math.max(0, CAP - used)} pizze disp.`}</span>
                    </div>
                  );
                })}
              </section>
              <section className="orders-table-wrap">
                {adminOrdersForDay.length === 0 && <p className="empty-msg">Nessuna prenotazione per questo giorno.</p>}
                {adminOrdersForDay.map((o) => (
                  <div className="order-row" key={o.id}>
                    <div className="order-main">
                      <span className="order-slot">{o.exactTime || o.slotLabel}</span>
                      <span className={"order-type-badge" + (o.orderType === "consegna" ? " consegna" : "")}>
                        {o.orderType === "consegna" ? <><Bike size={12} /> Consegna</> : <><Store size={12} /> Ritiro</>}
                      </span>
                      <span className="order-name">{o.customerName}</span>
                      <span className="order-phone">{o.phone}</span>
                    </div>
                    {o.orderType === "consegna" && o.address && (
                      <div className="order-address">
                        {o.address.street}{o.address.scala ? `, scala ${o.address.scala}` : ""}{o.address.piano ? `, piano ${o.address.piano}` : ""}
                      </div>
                    )}
                    <div className="order-items">{o.items.map((it) => `${it.qty}× ${it.name}`).join(", ")}</div>
                    <div className="order-right">
                      <span className="order-total">{o.totalPizzas} pizze · {euro(o.totalPrice)}</span>
                      <button className="icon-btn danger" onClick={() => deleteOrder(o.id)}><Trash2 size={15} /></button>
                    </div>
                  </div>
                ))}
              </section>
            </>
          )}

          {adminSubView === "menu" && (
            <section className="menu-editor">
              <h2 className="section-title"><PizzaIcon size={16} /> Pizze del menu</h2>
              <div className="menu-list">
                {menu.map((p) => (
                  <div className="menu-row editable" key={p.id}>
                    <input className="edit-name" value={p.name} onChange={(e) => updateMenuItemLocal(p.id, "name", e.target.value)} onBlur={commitMenuEdit} />
                    <input className="edit-price" type="number" step="0.5" value={p.price} onChange={(e) => updateMenuItemLocal(p.id, "price", parseFloat(e.target.value) || 0)} onBlur={commitMenuEdit} />
                    <button className="icon-btn danger" onClick={() => removeMenuItem(p.id)}><Trash2 size={14} /></button>
                  </div>
                ))}
              </div>
              <div className="new-pizza-row">
                <input placeholder="Nome nuova pizza" value={newPizzaName} onChange={(e) => setNewPizzaName(e.target.value)} />
                <input placeholder="Prezzo €" value={newPizzaPrice} onChange={(e) => setNewPizzaPrice(e.target.value)} />
                <button className="submit-btn small" onClick={addMenuItem}><Plus size={14} /> Aggiungi</button>
              </div>

              <h2 className="section-title" style={{ marginTop: 26 }}><Ruler size={16} /> Formati mezzo metro / metro</h2>
              {formats.map((f) => (
                <div key={f.id} className="format-editor-group">
                  <h3 className="format-editor-title">{f.name}</h3>
                  <div className="menu-list">
                    {f.variants.map((v) => (
                      <div className="menu-row editable" key={v.id}>
                        <span className="format-fixed-name">{v.label}</span>
                        <input
                          className="edit-price"
                          type="number"
                          step="0.5"
                          value={v.price}
                          onChange={(e) => updateFormatVariantLocal(f.id, v.id, parseFloat(e.target.value) || 0)}
                          onBlur={commitFormatEdit}
                        />
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </section>
          )}

          {adminSubView === "impostazioni" && (
            <section className="settings-section">
              <div className="settings-card">
                <h3><Lock size={15} /> Cambia PIN gestionale</h3>
                <input className="settings-input" type="password" placeholder="PIN attuale" value={curPin} onChange={(e) => setCurPin(e.target.value)} />
                <input className="settings-input" type="password" placeholder="Nuovo PIN (4-6 cifre)" value={newPin} onChange={(e) => setNewPin(e.target.value)} />
                <input className="settings-input" type="password" placeholder="Conferma nuovo PIN" value={confirmPin} onChange={(e) => setConfirmPin(e.target.value)} />
                {pinSettingsMsg && <span className={"pin-msg " + pinSettingsMsg.kind}>{pinSettingsMsg.text}</span>}
                <button className="submit-btn small" onClick={savePin}>Salva PIN</button>
              </div>

              <div className="settings-card">
                <h3><Bike size={15} /> Costo di consegna</h3>
                <div className="field">
                  <span>€</span>
                  <input value={deliveryFeeInput} onChange={(e) => setDeliveryFeeInput(e.target.value)} />
                </div>
                <button className="submit-btn small" onClick={saveDeliveryFee}>Salva costo</button>
              </div>
            </section>
          )}
        </main>
      )}

      {toast && (
        <div className={"toast" + (toast.kind === "err" ? " toast-err" : "")}>
          {toast.kind === "err" ? <CircleAlert size={16} /> : <Check size={16} />}
          {toast.msg}
        </div>
      )}
    </div>
  );
}

.qty-val { min-width: 18px; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; }

.format-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.format-card .menu-row { background: transparent; border: none; }
.variant-block { padding: 2px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
.variant-picker { display: flex; flex-wrap: wrap; gap: 6px; }
.variant-chip { background: var(--surface); border: 1px solid var(--line); color: var(--text-dim); padding: 7px 12px; border-radius: 12px; font-size: 12px; cursor: pointer; text-align: left; }
.variant-chip-active { border-color: var(--ember); color: var(--text); box-shadow: 0 0 0 1px var(--ember); }
.gusti-picker { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.gusti-fixed-label { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-right: 2px; }
.gusto-chip { background: var(--surface); border: 1px solid var(--line); color: var(--text-dim); padding: 6px 11px; border-radius: 999px; font-size: 12px; cursor: pointer; }
.gusto-chip-active { background: var(--ember); border-color: var(--ember); color: #1b1512; }
.gusti-count { font-size: 11px; color: var(--text-dim); margin-left: 4px; }
.format-editor-group { margin-bottom: 14px; }
.format-editor-title { font-size: 13px; font-weight: 700; margin: 10px 0 8px; color: var(--flame); }

.summary-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.summary-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-dim); }
.summary-row strong { color: var(--text); font-family: 'JetBrains Mono', monospace; }
.field { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--text-dim); }
.field input { background: transparent; border: none; outline: none; color: var(--text); font-size: 13.5px; flex: 1; font-family: inherit; }
.warn-line { display: flex; align-items: center; gap: 6px; color: var(--err); font-size: 12.5px; }
.submit-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--ember); color: #1b1512; border: none; border-radius: 999px; padding: 12px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 4px; }
.submit-btn:disabled { opacity: .6; }
.submit-btn.small { padding: 9px 14px; font-size: 12.5px; }

.admin-lock { display: flex; align-items: center; justify-content: center; min-height: 50vh; }
.lock-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; max-width: 320px; }
.lock-icon { color: var(--ember); }
.pin-input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; color: var(--text); text-align: center; letter-spacing: 4px; width: 140px; font-family: 'JetBrains Mono', monospace; }
.pin-error { color: var(--err); font-size: 12px; display: flex; align-items: center; gap: 5px; }
.pin-hint { font-size: 10.5px; color: var(--text-dim); margin-top: 6px; }

.admin-header { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
.admin-header h1 { font-family: 'Anton', sans-serif; font-size: 26px; margin: 0; }
.admin-subtabs { display: flex; gap: 6px; background: var(--surface); border-radius: 999px; padding: 4px; width: fit-content; }
.subtab { border: none; background: transparent; color: var(--text-dim); padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.subtab-active { background: var(--ember); color: #1b1512; }
.date-select-row { margin-bottom: 16px; }
.date-select { background: var(--surface); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-family: inherit; }
.admin-slots { margin-bottom: 26px; }

.orders-table-wrap { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }
.empty-msg { color: var(--text-dim); font-size: 13.5px; }
.order-row { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.order-main { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.order-slot { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ember); }
.order-type-badge { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); background: var(--surface-2); padding: 3px 8px; border-radius: 999px; }
.order-type-badge.consegna { color: var(--flame); }
.order-name { font-weight: 600; font-size: 13.5px; }
.order-phone { font-size: 12px; color: var(--text-dim); }
.order-address { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
.order-items { font-size: 12.5px; color: var(--text-dim); }
.order-right { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.order-total { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
.icon-btn { background: transparent; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; }
.icon-btn.danger:hover { color: var(--err); }

.menu-editor { margin-top: 4px; }
.menu-row.editable { gap: 8px; }
.edit-name { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 14px; font-weight: 600; font-family: inherit; }
.edit-price { width: 70px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
.format-fixed-name { flex: 1; font-size: 14px; font-weight: 600; }
.format-gusti-label { font-size: 11.5px; color: var(--text-dim); width: 80px; text-align: right; }
.new-pizza-row { display: flex; gap: 8px; margin-top: 12px; }
.new-pizza-row input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--text); font-size: 13px; font-family: inherit; }
.new-pizza-row input:first-child { flex: 1; }
.new-pizza-row input:nth-child(2) { width: 90px; }

.settings-section { display: flex; flex-direction: column; gap: 16px; }
.settings-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 340px; }
.settings-card h3 { display: flex; align-items: center; gap: 7px; font-size: 14px; margin: 0 0 4px; }
.settings-input { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--text); font-size: 13.5px; font-family: inherit; }
.pin-msg { font-size: 12px; }
.pin-msg.err { color: var(--err); }
.pin-msg.ok { color: var(--ok); }

.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ok); color: #10240c; padding: 12px 20px; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.4); z-index: 50; }
.toast-err { background: var(--err); color: #2a0f0b; }

@media (max-width: 480px) {
  .hero h1 { font-size: 28px; }
  .slots-grid { grid-template-columns: repeat(2, 1fr); }
  .order-type-toggle { flex-direction: column; }
}
`;

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
